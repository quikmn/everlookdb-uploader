# macOS release: on a vX.Y.Z tag, build a universal (Apple silicon + Intel) app, sign it with the Developer ID and
# notarize it when the secrets are set (ad-hoc signed otherwise), and upload the .dmg plus the updater files to the
# GitHub release (created as a draft if the Windows script hasn't made it yet). Windows is built and signed locally
# by scripts/release-windows.ps1, which also writes latest.json.
#
# Secrets: MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD (Developer ID Application certificate), APPSTORE_API_KEY_BASE64,
# APPSTORE_KEY_ID, APPSTORE_ISSUER_ID (App Store Connect API key, for notarization), TAURI_SIGNING_PRIVATE_KEY,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater key). Optional variable: MAC_IDENTITY (read from the certificate when unset).
name: Release (macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(jq -r .version src-tauri/tauri.conf.json)" = "$TAG"
      # Same keychain setup as Iskra: our own keychain, unlocked for the whole job.
      - name: Apple signing and notarization keys
        env:
          CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          IDENTITY: ${{ vars.MAC_IDENTITY }}
        run: |
          if [ -n "$CERT" ] && [ -n "$API_KEY" ]; then
            echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            security find-identity -v -p codesigning "$keychain"
            # MAC_IDENTITY is optional: without a real value, use the Developer ID Application identity in the certificate.
            case "$IDENTITY" in "Developer ID Application:"*) ;; *)
              IDENTITY="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)" ;;
            esac
            if [ -z "$IDENTITY" ]; then echo "::error::No Developer ID Application identity in the certificate"; exit 1; fi
            echo "Signing as: $IDENTITY"
            {
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
              echo "APPLE_API_KEY=$API_KEY_ID"
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
              echo "MAC_SIGNED=1"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No Apple Developer ID secrets: building ad-hoc signed and not notarized (Gatekeeper will block it)."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY: building without updater files."
            extra=(-c '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app,dmg "${extra[@]}"
      - name: Check the signature
        if: env.MAC_SIGNED == '1'
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/EverlookDB Uploader.app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Authority=Developer ID Application|TeamIdentifier)'
          spctl --assess --type execute -vv "$app"
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="${TAG#v}"
          b="src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p dist
          cp "$b/dmg/"*.dmg "dist/EverlookDB-Uploader_${v}_universal.dmg"
          if [ -f "$b/macos/EverlookDB Uploader.app.tar.gz.sig" ]; then
            cp "$b/macos/EverlookDB Uploader.app.tar.gz" "dist/EverlookDB-Uploader_${v}_universal.app.tar.gz"
            cp "$b/macos/EverlookDB Uploader.app.tar.gz.sig" "dist/EverlookDB-Uploader_${v}_universal.app.tar.gz.sig"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "EverlookDB Uploader $v" --notes "EverlookDB Uploader $v"
          gh release upload "$TAG" dist/* --clobber
