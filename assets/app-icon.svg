<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- EverlookDB App icon: the EverlookDB mark (everlookdb.com web/brand/mark.svg) on its navy tile, like the site logo.
       Regenerate the icon set with: npx @tauri-apps/cli@2 icon assets/app-icon.svg -o src-tauri/icons
       (then delete the android, ios and Square*/StoreLogo files it adds: the app doesn't use them). -->
  <defs>
    <radialGradient id="bg" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="#13223F"/><stop offset="1" stop-color="#070D1A"/></radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6DB8F7"/><stop offset="1" stop-color="#3B7BD6"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E62BE"/><stop offset=".45" stop-color="#4A8BE0"/><stop offset="1" stop-color="#2A57AE"/></linearGradient>
    <linearGradient id="au" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3CC66"/><stop offset="1" stop-color="#C9952E"/></linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="103" fill="none" stroke="#2A3F66" stroke-width="2"/>
  <g transform="translate(0 10)">
    <path fill="url(#side)" d="M128 300c0 22 57 40 128 40s128-18 128-40v62c0 22-57 40-128 40s-128-18-128-40z"/>
    <path fill="url(#side)" d="M128 214c0 22 57 40 128 40s128-18 128-40v62c0 22-57 40-128 40s-128-18-128-40z"/>
    <path fill="url(#side)" d="M128 128c0 22 57 40 128 40s128-18 128-40v62c0 22-57 40-128 40s-128-18-128-40z"/>
    <ellipse cx="256" cy="128" rx="128" ry="40" fill="url(#top)"/>
    <ellipse cx="256" cy="128" rx="127" ry="39" fill="none" stroke="#9AD0FF" stroke-opacity=".5" stroke-width="2"/>
    <g fill="url(#au)"><circle cx="162" cy="186" r="11"/><circle cx="162" cy="272" r="11"/><circle cx="162" cy="358" r="11"/></g>
  </g>
