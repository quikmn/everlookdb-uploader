<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>EverlookDB</title>
<link rel="stylesheet" href="app.css">
<script src="search.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Games and settings">
    <button class="brand" type="button" data-act="url" data-url="https://everlookdb.com" title="Open everlookdb.com">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="mk-side" x1="0" x2="1"><stop offset="0" stop-color="#2E62BE"/><stop offset=".45" stop-color="#4A8BE0"/><stop offset="1" stop-color="#2A57AE"/></linearGradient>
          <linearGradient id="mk-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6DB8F7"/><stop offset="1" stop-color="#3B7BD6"/></linearGradient>
        </defs>
        <path fill="url(#mk-side)" d="M12 42c0 3 9 6 20 6s20-3 20-6v9c0 3-9 6-20 6s-20-3-20-6z"/>
        <path fill="url(#mk-side)" d="M12 29c0 3 9 6 20 6s20-3 20-6v9c0 3-9 6-20 6s-20-3-20-6z"/>
        <path fill="url(#mk-side)" d="M12 16c0 3 9 6 20 6s20-3 20-6v9c0 3-9 6-20 6s-20-3-20-6z"/>
        <ellipse cx="32" cy="16" rx="20" ry="6" fill="url(#mk-top)"/>
        <g fill="#ffd100"><circle cx="18" cy="25" r="1.9"/><circle cx="18" cy="38" r="1.9"/><circle cx="18" cy="51" r="1.9"/></g>
      </svg>
      <span class="wordmark">EverlookDB</span>
    </button>

    <h2 class="rail-title" id="games-title">Games</h2>
    <ul class="games" id="games" aria-labelledby="games-title"></ul>
    <button class="add-folder" id="add-folder" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      Add a game folder
    </button>

    <div class="rail-foot">
      <section class="uploads" aria-labelledby="uploads-title">
        <h2 class="rail-title" id="uploads-title">Uploads</h2>
        <p class="upload-line"><span class="dot" id="upload-dot"></span><span id="upload-text">Starting…</span></p>
        <ul class="upload-files" id="upload-files" aria-label="Each file's last upload" hidden></ul>
        <label class="switch">
          <input type="checkbox" id="sw-uploads" role="switch">
          <span class="track" aria-hidden="true"></span>
          <span class="switch-label">Send EverlookDB data</span>
        </label>
        <p class="link-row">
          <button class="text-button" id="upload-now" type="button">Upload now</button>
          <button class="text-button quiet" type="button" data-act="url" data-url="https://everlookdb.com/privacy.html">What gets uploaded</button>
        </p>
      </section>
      <!-- shown only while the giveaway is on (src-tauri/src/giveaway.rs) -->
      <section class="giveaway" id="giveaway" aria-labelledby="giveaway-title" hidden>
        <h2 class="rail-title" id="giveaway-title">Giveaway code</h2>
        <div class="gcode">
          <code id="giveaway-code">EVL-0-0</code>
          <button class="gcopy" type="button" data-act="copy-giveaway" id="giveaway-copy" title="Copy the giveaway code">
            <svg class="i-copy" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>
            <svg class="i-done" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>
            <span id="giveaway-copy-label">Copy</span>
          </button>
        </div>
        <ul class="gsteps" id="giveaway-steps" aria-label="What the giveaway needs"></ul>
        <p class="fine" id="giveaway-note"></p>
      </section>
      <section class="settings" aria-label="Settings">
        <label class="switch">
          <input type="checkbox" id="sw-auto" role="switch">
          <span class="track" aria-hidden="true"></span>
          <span class="switch-label">Update addons by itself</span>
        </label>
        <div class="every" role="group" aria-labelledby="every-label">
          <span id="every-label">Check every</span>
          <span class="stepper">
            <button type="button" id="hours-less" aria-label="One hour less" tabindex="-1">−</button>
            <input type="text" id="hours" inputmode="numeric" maxlength="3" autocomplete="off" spellcheck="false" aria-label="Hours between checks for addon updates">
            <button type="button" id="hours-more" aria-label="One hour more" tabindex="-1">+</button>
          </span>
          <span id="hours-unit">hours</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="sw-start" role="switch">
          <span class="track" aria-hidden="true"></span>
          <span class="switch-label" id="start-label">Start with Windows</span>
        </label>
        <p class="fine site">
          <button class="text-button quiet" type="button" data-act="url" data-url="https://everlookdb.com">EverlookDB: the WoW Forever database</button>
          <button class="text-button quiet" type="button" data-act="url" data-url="https://everlookdb.com/addons.html">Addons</button>
        </p>
        <p class="fine" id="app-version"></p>
      </section>
    </div>
  </nav>

  <main class="main" id="main">
    <header class="hero" id="hero"></header>

    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Addons">
        <button role="tab" id="tab-mine" aria-selected="true" aria-controls="list" type="button">My addons <span class="count" id="count-mine"></span></button>
        <button role="tab" id="tab-browse" aria-selected="false" aria-controls="list" type="button" tabindex="-1">Get addons <span class="count" id="count-browse"></span></button>
      </div>
      <div class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
        <input type="search" id="q" placeholder="Search addons" autocomplete="off" spellcheck="false" aria-label="Search addons">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <div class="list-tools" id="list-tools" hidden>
        <button class="tool" type="button" data-act="copy-list" id="copy-list" title="Copy every installed addon as text: name, version, author, folders and where it comes from">
          <svg class="i-copy" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>
          <svg class="i-done" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>
          <span id="copy-label">Copy list</span>
        </button>
        <button class="tool more" type="button" data-act="list-menu" id="list-menu-button" aria-haspopup="menu" aria-expanded="false" aria-controls="list-menu" title="More ways to share the list">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5l3.5 3.5 3.5-3.5"/></svg>
        </button>
        <div class="menu" id="list-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-act="copy-list">Copy addon list</button>
          <button type="button" role="menuitem" data-act="save-list">Save as text file…</button>
        </div>
      </div>
    </div>

    <div class="notice bad upload-alert" id="upload-alert" role="alert" hidden></div>
    <div class="notice" id="notice" role="status" hidden></div>
    <p class="sr-only" id="announce" aria-live="polite"></p>

    <div class="list" id="list" role="tabpanel" aria-labelledby="tab-mine"></div>

    <footer class="status" id="status"></footer>
  </main>
</div>
</body>
</html>
