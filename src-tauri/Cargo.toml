[package]
name = "everlookdb-uploader"
version = "0.7.2"
description = "EverlookDB: an ad-free World of Warcraft addon manager that also uploads EverlookDB addon data to everlookdb.com"
authors = ["Viktor Lundgren"]
license = "GPL-3.0-or-later"
repository = "https://github.com/quikmn/everlookdb-uploader"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# addon icons: PNG, JPEG and TGA (BLP is read by blp.rs); image is already in the tree through tauri
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Shell"] }
# turning WebView2's browser keys off (already in the tree through tauri/wry)
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
